<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="The closed loop of an inline inspection station: an encoder trigger fires the camera, the frame is localised, cropped and read, a verdict is produced, and the reject actuator fires before the product leaves the station.">
  <style>
    .bg    { fill: #f5f7f7; }
    .card  { fill: #ffffff; stroke: #d5dcdc; stroke-width: 1; }
    .box   { fill: #ffffff; stroke: #b9c4c3; stroke-width: 1.2; }
    .boxhw { fill: #eef1f1; stroke: #a8b4b3; stroke-width: 1.2; }
    .ink   { fill: #16211f; }
    .mid   { fill: #566664; }
    .soft  { fill: #869593; }
    .arrow { stroke: #869593; stroke-width: 1.5; fill: none; }
    .head  { fill: #869593; }
    .hot   { stroke: #b8524a; stroke-width: 1.6; fill: none; }
    .hothd { fill: #b8524a; }
    .red   { fill: #b8524a; }
    .band  { fill: #f0e6e4; stroke: #ddc6c2; stroke-width: 1; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h     { font-size: 14px; font-weight: 700; }
    .t     { font-size: 11px; font-weight: 600; }
    .s     { font-size: 9.5px; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #131b1a; }
      .card  { fill: #1a2423; stroke: #2d3b3a; }
      .box   { fill: #1f2b2a; stroke: #3b4a49; }
      .boxhw { fill: #172120; stroke: #33413f; }
      .ink   { fill: #e3ebe9; }
      .mid   { fill: #a4b3b1; }
      .soft  { fill: #7b8a88; }
      .arrow { stroke: #7b8a88; }
      .head  { fill: #7b8a88; }
      .hot   { stroke: #e8877d; }
      .hothd { fill: #e8877d; }
      .red   { fill: #e8877d; }
      .band  { fill: #2b1b19; stroke: #4a302c; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="330" rx="4"/>
  <rect class="card" x="16" y="16" width="748" height="298" rx="4"/>

  <text class="h ink" x="36" y="44">One product, one pass, one verdict</text>
  <text class="s soft" x="36" y="61">The line does not wait. Everything between the trigger and the actuator has to fit in the time the product spends in the station.</text>

  <!-- hardware band -->
  <rect class="boxhw" x="36" y="84" width="132" height="60" rx="3"/>
  <text class="t ink" x="48" y="106">Encoder trigger</text>
  <text class="s mid" x="48" y="122">Product breaks the</text>
  <text class="s mid" x="48" y="134">beam, camera fires</text>

  <path class="arrow" d="M172 114 L196 114"/>
  <polygon class="head" points="196,110 204,114 196,118"/>

  <rect class="boxhw" x="208" y="84" width="126" height="60" rx="3"/>
  <text class="t ink" x="220" y="106">Capture</text>
  <text class="s mid" x="220" y="122">Hardware-triggered,</text>
  <text class="s mid" x="220" y="134">strobed illumination</text>

  <path class="arrow" d="M338 114 L362 114"/>
  <polygon class="head" points="362,110 370,114 362,118"/>

  <!-- vision band -->
  <rect class="box" x="374" y="84" width="126" height="60" rx="3"/>
  <text class="t ink" x="386" y="106">Localise</text>
  <text class="s mid" x="386" y="122">Template match to</text>
  <text class="s mid" x="386" y="134">a known fixture</text>

  <path class="arrow" d="M504 114 L528 114"/>
  <polygon class="head" points="528,110 536,114 528,118"/>

  <rect class="box" x="540" y="84" width="126" height="60" rx="3"/>
  <text class="t ink" x="552" y="106">Rectify + crop</text>
  <text class="s mid" x="552" y="122">Perspective correct,</text>
  <text class="s mid" x="552" y="134">cut fixed ROIs</text>

  <!-- down and back -->
  <path class="arrow" d="M603 148 L603 176"/>
  <polygon class="head" points="599,176 603,184 607,176"/>

  <rect class="box" x="540" y="188" width="126" height="60" rx="3"/>
  <text class="t ink" x="552" y="210">Read</text>
  <text class="s mid" x="552" y="226">Recognition only,</text>
  <text class="s mid" x="552" y="238">no detector stage</text>

  <path class="arrow" d="M536 218 L512 218"/>
  <polygon class="head" points="512,214 504,218 512,222"/>

  <rect class="box" x="374" y="188" width="126" height="60" rx="3"/>
  <text class="t ink" x="386" y="210">Verdict</text>
  <text class="s mid" x="386" y="226">Compare against the</text>
  <text class="s mid" x="386" y="238">expected recipe</text>

  <path class="hot" d="M370 218 L346 218"/>
  <polygon class="hothd" points="346,214 338,218 346,222"/>

  <rect class="boxhw" x="208" y="188" width="126" height="60" rx="3"/>
  <text class="t ink" x="220" y="210">Actuator</text>
  <text class="s mid" x="220" y="226">PLC fires the</text>
  <text class="s mid" x="220" y="238">reject arm</text>

  <path class="hot" d="M204 218 L180 218"/>
  <polygon class="hothd" points="180,214 172,218 180,222"/>

  <rect class="boxhw" x="36" y="188" width="132" height="60" rx="3"/>
  <text class="t ink" x="48" y="210">Product leaves</text>
  <text class="s mid" x="48" y="226">Passed on, or in</text>
  <text class="s mid" x="48" y="238">the reject bin</text>

  <!-- latency band -->
  <rect class="band" x="36" y="264" width="708" height="34" rx="3"/>
  <text class="t red" x="50" y="285">Budget</text>
  <text class="s mid" x="102" y="285">At 180 products per minute the whole loop has about 330 ms, and the actuator has to fire before the product is physically past the arm.</text>
</svg>
