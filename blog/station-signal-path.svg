<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Signal path of one inspection station: a PLC trigger fires three cameras with different roles, each runs its own inference on the edge device, the per-camera verdicts are combined into one product verdict, and only a fail sends a reject command back to the PLC before the product leaves the station.">
  <style>
    .bg    { fill: #f5f7f7; }
    .card  { fill: #ffffff; stroke: #d5dcdc; stroke-width: 1; }
    .box   { fill: #ffffff; stroke: #b9c4c3; stroke-width: 1.2; }
    .hw    { fill: #eef1f1; stroke: #a8b4b3; stroke-width: 1.2; }
    .zone  { fill: none; stroke: #c9d2d2; stroke-width: 1; stroke-dasharray: 4 4; }
    .ink   { fill: #16211f; }
    .mid   { fill: #566664; }
    .soft  { fill: #869593; }
    .wire  { stroke: #869593; stroke-width: 1.4; fill: none; }
    .whead { fill: #869593; }
    .sig   { stroke: #0d7a72; stroke-width: 1.6; fill: none; }
    .shead { fill: #0d7a72; }
    .teal  { fill: #0d7a72; }
    .hot   { stroke: #b8524a; stroke-width: 1.8; fill: none; }
    .hhead { fill: #b8524a; }
    .red   { fill: #b8524a; }
    .blue  { fill: #2563a8; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h     { font-size: 14px; font-weight: 700; }
    .t     { font-size: 11px; font-weight: 600; }
    .s     { font-size: 9.5px; }
    .zl    { font-size: 9px; letter-spacing: .08em; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #131b1a; }
      .card { fill: #1a2423; stroke: #2d3b3a; }
      .box  { fill: #1f2b2a; stroke: #3b4a49; }
      .hw   { fill: #172120; stroke: #33413f; }
      .zone { stroke: #33413f; }
      .ink  { fill: #e3ebe9; }
      .mid  { fill: #a4b3b1; }
      .soft { fill: #7b8a88; }
      .wire { stroke: #7b8a88; }
      .whead{ fill: #7b8a88; }
      .sig  { stroke: #45c2b6; }
      .shead{ fill: #45c2b6; }
      .teal { fill: #45c2b6; }
      .hot  { stroke: #e8877d; }
      .hhead{ fill: #e8877d; }
      .red  { fill: #e8877d; }
      .blue { fill: #6ba8e8; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="470" rx="4"/>
  <rect class="card" x="16" y="16" width="788" height="438" rx="4"/>

  <text class="h ink" x="36" y="44">One station, three views, one verdict</text>
  <text class="s soft" x="36" y="61">Each camera answers a different question. A product passes only if all of them agree.</text>

  <!-- zone labels -->
  <rect class="zone" x="30" y="76" width="128" height="308" rx="3"/>
  <text class="zl soft" x="40" y="94">MACHINE</text>
  <rect class="zone" x="176" y="76" width="440" height="308" rx="3"/>
  <text class="zl soft" x="186" y="94">EDGE DEVICE</text>
  <rect class="zone" x="634" y="76" width="154" height="308" rx="3"/>
  <text class="zl soft" x="644" y="94">OFF THE LINE</text>

  <!-- PLC trigger -->
  <rect class="hw" x="44" y="112" width="100" height="56" rx="3"/>
  <text class="t ink" x="56" y="134">PLC</text>
  <text class="s mid" x="56" y="150">Product in</text>
  <text class="s mid" x="56" y="162">position</text>

  <path class="wire" d="M148 140 L172 140"/>
  <polygon class="whead" points="172,136 180,140 172,144"/>
  <text class="m soft" x="150" y="130">trigger</text>

  <!-- three cameras -->
  <rect class="box" x="188" y="106" width="176" height="42" rx="3"/>
  <text class="m blue" x="200" y="122">CAM002</text>
  <text class="s mid" x="200" y="138">Front label, alignment</text>

  <rect class="box" x="188" y="158" width="176" height="42" rx="3"/>
  <text class="m blue" x="200" y="174">CAM_Ktra_mat_sau</text>
  <text class="s mid" x="200" y="190">Back label, wrinkles</text>

  <rect class="box" x="188" y="210" width="176" height="42" rx="3"/>
  <text class="m blue" x="200" y="226">Camera_Ktra_datecode</text>
  <text class="s mid" x="200" y="242">Date code, readable</text>

  <!-- fan out from trigger -->
  <path class="wire" d="M180 140 L188 140"/>
  <path class="wire" d="M184 140 L184 179 L188 179"/>
  <path class="wire" d="M184 140 L184 231 L188 231"/>
  <polygon class="whead" points="188,175 194,179 188,183"/>
  <polygon class="whead" points="188,227 194,231 188,235"/>

  <!-- per camera inference -->
  <path class="sig" d="M368 127 L396 127"/>
  <polygon class="shead" points="396,123 404,127 396,131"/>
  <path class="sig" d="M368 179 L396 179"/>
  <polygon class="shead" points="396,175 404,179 396,183"/>
  <path class="sig" d="M368 231 L396 231"/>
  <polygon class="shead" points="396,227 404,231 396,235"/>

  <rect class="box" x="410" y="106" width="188" height="146" rx="3"/>
  <text class="t ink" x="424" y="126">Per-camera inference</text>
  <text class="s mid" x="424" y="144">Locate by template match,</text>
  <text class="s mid" x="424" y="157">rectify, cut the ROIs,</text>
  <text class="s mid" x="424" y="170">read, then score.</text>
  <text class="s mid" x="424" y="192">Emits per camera:</text>
  <text class="m teal" x="424" y="208">SCORE 89.2%</text>
  <text class="m teal" x="424" y="222">TIME 173.1 ms</text>
  <text class="m teal" x="424" y="236">Offset 7.9px L(28/28)</text>

  <!-- verdict -->
  <path class="sig" d="M504 256 L504 280"/>
  <polygon class="shead" points="500,280 504,288 508,280"/>

  <rect class="box" x="410" y="292" width="188" height="76" rx="3"/>
  <text class="t ink" x="424" y="312">Combine</text>
  <text class="s mid" x="424" y="329">All cameras PASS, product</text>
  <text class="s mid" x="424" y="342">passes. Any camera FAIL,</text>
  <text class="s mid" x="424" y="355">product is rejected.</text>

  <!-- to storage / dashboard -->
  <path class="wire" d="M602 330 L630 330"/>
  <polygon class="whead" points="630,326 638,330 630,334"/>
  <text class="m soft" x="600" y="322">every result</text>

  <rect class="box" x="646" y="106" width="130" height="70" rx="3"/>
  <text class="t ink" x="658" y="126">Live monitor</text>
  <text class="s mid" x="658" y="143">Frames, overlays,</text>
  <text class="s mid" x="658" y="156">running counters</text>

  <rect class="box" x="646" y="188" width="130" height="70" rx="3"/>
  <text class="t ink" x="658" y="208">Results log</text>
  <text class="s mid" x="658" y="225">Every trigger, kept</text>
  <text class="s mid" x="658" y="238">for the audit trail</text>

  <rect class="box" x="646" y="270" width="130" height="70" rx="3"/>
  <text class="t ink" x="658" y="290">Analytics</text>
  <text class="s mid" x="658" y="307">Trends by shift,</text>
  <text class="s mid" x="658" y="320">recipe and camera</text>

  <path class="wire" d="M638 330 L642 330 L642 141 L646 141"/>
  <path class="wire" d="M642 223 L646 223"/>
  <path class="wire" d="M642 305 L646 305"/>
  <polygon class="whead" points="646,137 652,141 646,145"/>
  <polygon class="whead" points="646,219 652,223 646,227"/>
  <polygon class="whead" points="646,301 652,305 646,309"/>

  <!-- hot path back to PLC -->
  <path class="hot" d="M410 340 L94 340 L94 176"/>
  <polygon class="hhead" points="90,176 94,168 98,176"/>
  <text class="m red" x="150" y="334">reject command, only on FAIL</text>

  <!-- deadline note -->
  <rect class="box" x="30" y="396" width="758" height="42" rx="3"/>
  <text class="t red" x="44" y="414">Deadline</text>
  <text class="s mid" x="104" y="414">The red path is the only one with a hard deadline. Everything on the right can be late, dropped or replayed without stopping the line.</text>
  <text class="s mid" x="104" y="429">At 180 products per minute the whole loop has roughly 330 ms, and three cameras at ~173 ms each is why they run in parallel rather than in sequence.</text>
</svg>
