<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Comparison of an artificial neuron, which outputs a single real number, with a spiking neuron, which integrates input over time and outputs a train of spikes.">
  <style>
    .bg    { fill: #f6f8f8; }
    .card  { fill: #ffffff; stroke: #d7dede; stroke-width: 1; }
    .ink   { fill: #16211f; }
    .mid   { fill: #5a6a68; }
    .soft  { fill: #8a9998; }
    .rule  { stroke: #c9d2d2; stroke-width: 1; }
    .wire  { stroke: #8a9998; stroke-width: 1.4; fill: none; }
    .blue  { stroke: #2563a8; fill: #2563a8; }
    .blueln{ stroke: #2563a8; stroke-width: 2; fill: none; }
    .teal  { stroke: #0d7a72; fill: #0d7a72; }
    .tealln{ stroke: #0d7a72; stroke-width: 2; fill: none; }
    .dash  { stroke: #b8524a; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .red   { fill: #b8524a; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h     { font-size: 14px; font-weight: 700; }
    .l     { font-size: 11.5px; }
    .s     { font-size: 10px; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #131c1b; }
      .card { fill: #1a2524; stroke: #2e3e3c; }
      .ink  { fill: #e4ecea; }
      .mid  { fill: #a6b5b3; }
      .soft { fill: #7d8c8a; }
      .rule { stroke: #2e3e3c; }
      .wire { stroke: #7d8c8a; }
      .blue { stroke: #6ba8e8; fill: #6ba8e8; }
      .blueln { stroke: #6ba8e8; }
      .teal { stroke: #45c2b6; fill: #45c2b6; }
      .tealln { stroke: #45c2b6; }
      .dash { stroke: #e8877d; }
      .red  { fill: #e8877d; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="330" rx="4"/>

  <!-- ================= LEFT: ANN ================= -->
  <rect class="card" x="16" y="16" width="352" height="298" rx="4"/>
  <text class="h ink" x="34" y="42">Artificial neuron</text>
  <text class="s soft" x="34" y="58">One forward pass. Time is not part of the model.</text>

  <!-- inputs -->
  <circle class="blue" cx="58" cy="112" r="5"/>
  <circle class="blue" cx="58" cy="152" r="5"/>
  <circle class="blue" cx="58" cy="192" r="5"/>
  <text class="m mid" x="34" y="116">x₁</text>
  <text class="m mid" x="34" y="156">x₂</text>
  <text class="m mid" x="34" y="196">x₃</text>

  <path class="wire" d="M64 112 L146 148"/>
  <path class="wire" d="M64 152 L146 152"/>
  <path class="wire" d="M64 192 L146 156"/>
  <text class="s soft" x="96" y="122">w₁</text>
  <text class="s soft" x="96" y="146">w₂</text>
  <text class="s soft" x="96" y="184">w₃</text>

  <!-- sum node -->
  <circle class="card" cx="164" cy="152" r="18"/>
  <text class="l ink" x="157" y="157">Σ</text>

  <!-- activation curve -->
  <rect class="card" x="206" y="118" width="70" height="68" rx="3"/>
  <path class="blueln" d="M214 176 L241 176 L268 128"/>
  <text class="s soft" x="216" y="196">ReLU</text>

  <path class="wire" d="M182 152 L204 152"/>
  <path class="wire" d="M278 152 L308 152"/>
  <polygon class="soft" points="308,148 316,152 308,156"/>

  <text class="m ink" x="290" y="140">0.73</text>
  <text class="s soft" x="228" y="232">Output is a single real number,</text>
  <text class="s soft" x="228" y="246">produced in one shot.</text>
  <text class="m mid" x="34" y="286">y = ReLU( Σ wᵢxᵢ + b )</text>

  <!-- ================= RIGHT: SNN ================= -->
  <rect class="card" x="392" y="16" width="352" height="298" rx="4"/>
  <text class="h ink" x="410" y="42">Spiking neuron</text>
  <text class="s soft" x="410" y="58">State persists. The same input at a different time differs.</text>

  <!-- input spike trains -->
  <text class="s soft" x="410" y="86">input spikes</text>
  <line class="rule" x1="410" y1="104" x2="530" y2="104"/>
  <line class="blue" x1="424" y1="104" x2="424" y2="92" stroke-width="2"/>
  <line class="blue" x1="452" y1="104" x2="452" y2="92" stroke-width="2"/>
  <line class="blue" x1="462" y1="104" x2="462" y2="92" stroke-width="2"/>
  <line class="blue" x1="500" y1="104" x2="500" y2="92" stroke-width="2"/>

  <line class="rule" x1="410" y1="132" x2="530" y2="132"/>
  <line class="blue" x1="432" y1="132" x2="432" y2="120" stroke-width="2"/>
  <line class="blue" x1="478" y1="132" x2="478" y2="120" stroke-width="2"/>
  <line class="blue" x1="514" y1="132" x2="514" y2="120" stroke-width="2"/>

  <path class="wire" d="M534 104 Q554 118 560 152"/>
  <path class="wire" d="M534 132 Q552 140 560 152"/>

  <!-- membrane trace -->
  <text class="s soft" x="410" y="176">membrane potential V(t)</text>
  <line class="rule" x1="410" y1="248" x2="712" y2="248"/>
  <line class="dash" x1="410" y1="196" x2="712" y2="196"/>
  <text class="s red" x="716" y="199">θ</text>

  <path class="tealln" d="M410 248 L426 248 L426 226 L446 234 L446 210 L466 216 L466 192
                           L468 248 L490 248 L490 228 L510 234 L510 214 L530 220 L530 192
                           L532 248 L556 248 L556 232 L578 238 L578 220 L600 226 L600 196
                           L612 240 L640 244 L640 224 L662 230 L662 192 L664 248 L712 248"/>

  <!-- output spikes -->
  <text class="s soft" x="410" y="288">output spikes</text>
  <line class="rule" x1="410" y1="300" x2="712" y2="300"/>
  <line class="teal" x1="467" y1="300" x2="467" y2="284" stroke-width="2"/>
  <line class="teal" x1="531" y1="300" x2="531" y2="284" stroke-width="2"/>
  <line class="teal" x1="601" y1="300" x2="601" y2="284" stroke-width="2"/>
  <line class="teal" x1="663" y1="300" x2="663" y2="284" stroke-width="2"/>

  <text class="s soft" x="620" y="176">crosses θ → fire → reset</text>
</svg>
