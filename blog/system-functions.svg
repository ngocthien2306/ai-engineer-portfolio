<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="The functions of the vision system grouped by who uses them: an engineer configures recipes and regions offline, an operator runs and watches the line, and a manager reads history and trends. Only the operator layer is on the critical path.">
  <style>
    .bg    { fill: #f5f7f7; }
    .card  { fill: #ffffff; stroke: #d5dcdc; stroke-width: 1; }
    .lane  { fill: #fafbfb; stroke: #dde3e3; stroke-width: 1; }
    .laneL { fill: #f2f7f6; stroke: #c6dedb; stroke-width: 1.4; }
    .box   { fill: #ffffff; stroke: #b9c4c3; stroke-width: 1.2; }
    .ink   { fill: #16211f; }
    .mid   { fill: #566664; }
    .soft  { fill: #869593; }
    .teal  { fill: #0d7a72; }
    .red   { fill: #b8524a; }
    .wire  { stroke: #869593; stroke-width: 1.3; fill: none; }
    .whead { fill: #869593; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h     { font-size: 14px; font-weight: 700; }
    .lane-t{ font-size: 11.5px; font-weight: 700; }
    .t     { font-size: 10.5px; font-weight: 600; }
    .s     { font-size: 9px; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #131b1a; }
      .card  { fill: #1a2423; stroke: #2d3b3a; }
      .lane  { fill: #16201f; stroke: #2a3837; }
      .laneL { fill: #162827; stroke: #2f5450; }
      .box   { fill: #1f2b2a; stroke: #3b4a49; }
      .ink   { fill: #e3ebe9; }
      .mid   { fill: #a4b3b1; }
      .soft  { fill: #7b8a88; }
      .teal  { fill: #45c2b6; }
      .red   { fill: #e8877d; }
      .wire  { stroke: #7b8a88; }
      .whead { fill: #7b8a88; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="430" rx="4"/>
  <rect class="card" x="16" y="16" width="788" height="398" rx="4"/>

  <text class="h ink" x="36" y="44">What the system does, grouped by who needs it</text>
  <text class="s soft" x="36" y="61">Three audiences with different tolerances for latency. Only the middle lane runs while the line is moving.</text>

  <!-- LANE 1: engineer, offline -->
  <rect class="lane" x="36" y="80" width="248" height="196" rx="3"/>
  <text class="lane-t ink" x="50" y="102">Setup</text>
  <text class="m soft" x="50" y="116">ENGINEER  ·  LINE STOPPED</text>

  <rect class="box" x="50" y="126" width="220" height="34" rx="3"/>
  <text class="t ink" x="62" y="147">Recipe management</text>
  <rect class="box" x="50" y="166" width="220" height="34" rx="3"/>
  <text class="t ink" x="62" y="187">Camera setup and calibration</text>
  <rect class="box" x="50" y="206" width="220" height="34" rx="3"/>
  <text class="t ink" x="62" y="227">Reference image and ROI editor</text>
  <rect class="box" x="50" y="246" width="220" height="20" rx="3"/>
  <text class="s mid" x="62" y="260">Thresholds, tolerances, enabled checks</text>

  <!-- LANE 2: operator, live -->
  <rect class="laneL" x="296" y="80" width="248" height="196" rx="3"/>
  <text class="lane-t ink" x="310" y="102">Run</text>
  <text class="m teal" x="310" y="116">OPERATOR  ·  LINE MOVING</text>

  <rect class="box" x="310" y="126" width="220" height="34" rx="3"/>
  <text class="t ink" x="322" y="147">Start / stop recipe</text>
  <rect class="box" x="310" y="166" width="220" height="34" rx="3"/>
  <text class="t ink" x="322" y="180">Realtime monitor</text>
  <text class="s mid" x="322" y="193">Live frames, overlays, per-camera score</text>
  <rect class="box" x="310" y="206" width="220" height="34" rx="3"/>
  <text class="t ink" x="322" y="220">Inference mode toggle</text>
  <text class="s mid" x="322" y="233">Run without acting on the verdict</text>
  <rect class="box" x="310" y="246" width="220" height="20" rx="3"/>
  <text class="s mid" x="322" y="260">Simulate trigger, for setup and testing</text>

  <!-- LANE 3: manager, after -->
  <rect class="lane" x="556" y="80" width="248" height="196" rx="3"/>
  <text class="lane-t ink" x="570" y="102">Review</text>
  <text class="m soft" x="570" y="116">MANAGER  ·  AFTER THE FACT</text>

  <rect class="box" x="570" y="126" width="220" height="34" rx="3"/>
  <text class="t ink" x="582" y="147">Results log and image archive</text>
  <rect class="box" x="570" y="166" width="220" height="34" rx="3"/>
  <text class="t ink" x="582" y="187">Counters by shift and by camera</text>
  <rect class="box" x="570" y="206" width="220" height="34" rx="3"/>
  <text class="t ink" x="582" y="227">Trend analytics and export</text>
  <rect class="box" x="570" y="246" width="220" height="20" rx="3"/>
  <text class="s mid" x="582" y="260">Natural language queries over the data</text>

  <!-- flows between lanes -->
  <path class="wire" d="M284 176 L296 176"/>
  <polygon class="whead" points="296,172 304,176 296,180"/>
  <text class="m soft" x="240" y="168">config</text>

  <path class="wire" d="M544 176 L556 176"/>
  <polygon class="whead" points="556,172 564,176 556,180"/>
  <text class="m soft" x="506" y="168">results</text>

  <path class="wire" d="M666 276 L666 296 L166 296 L166 280"/>
  <polygon class="whead" points="162,280 166,272 170,280"/>
  <text class="m soft" x="360" y="292">what the data says to change</text>

  <!-- the important distinction -->
  <rect class="box" x="36" y="316" width="768" height="80" rx="3"/>
  <text class="t ink" x="52" y="338">The distinction that matters when building this</text>
  <text class="s mid" x="52" y="356">The middle lane has a deadline measured in milliseconds and cannot be allowed to fail. The outer two are ordinary web software: they can be slow,</text>
  <text class="s mid" x="52" y="370">they can be down for an hour, and nothing stops. Keeping them in separate processes is what lets the dashboard crash without taking the line with it.</text>
  <text class="s red" x="52" y="388">The toggle in the middle lane matters more than it looks: it lets an operator keep the system watching while it is not yet trusted to act.</text>
</svg>
